<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TestSeed: deterministic, schema-aware test data for TypeScript</title>
    <meta
      name="description"
      content="Deterministic, schema-aware, relational test data and edge-case fixtures for TypeScript and JavaScript. Reproducible by seed, foreign keys that resolve, zero dependencies."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2314171c%27/%3E%3Cpath d=%27M16 24V15M16 15c0-4 2.6-6 6.5-6 0 4-2.6 6-6.5 6ZM16 19c0-3-2-4.8-5-4.8 0 3 2 4.8 5 4.8Z%27 fill=%27none%27 stroke=%27%237fb0ea%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E"
    />
    <script>
      // A visitor's own choice (the theme toggle) wins; otherwise follow the system.
      try {
        var choice = localStorage.getItem('testseed-site:theme');
        document.documentElement.dataset.theme =
          choice === 'light' || choice === 'dark'
            ? choice
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
      document.documentElement.dataset.view = 'home';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
